<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/srimanasa-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F2038" />
    <title>Srimanasa Educational Academy | Inspiring Excellence, Shaping Futures</title>
    <meta name="description" content="Premier coaching institute for Classes 8–12, CBSE/ICSE, NEET, and IIT-JEE. Proven pedagogy, expert faculty, and exceptional board & competitive exam results." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Srimanasa Educational Academy" />
    <meta property="og:description" content="Empowering young minds with conceptual clarity, personalized mentorship, and proven competitive academic results." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Prevent flash of incorrect theme on initial page load -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('srimanasa_theme');
          var isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-800 font-sans antialiased selection:bg-accent-200 selection:text-primary-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
